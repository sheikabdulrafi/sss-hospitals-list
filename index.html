<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StaffEx Hospital Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--primary:#0d4d8b;
--primary2:#123c6b;
--accent:#1da1f2;
--bg:#eef3f9;
--card:#ffffff;
--text:#1f2937;
--muted:#6b7280;
--border:#dbe4ef;
--shadow:0 10px 35px rgba(15,23,42,.08);
}

body{
font-family:'Inter',sans-serif;
background:linear-gradient(180deg,#edf4fb,#f8fbff);
color:var(--text);
overflow-x:hidden;
}

.hero{
background:linear-gradient(135deg,#0b3762,#0f5ca8);
padding:26px 18px 90px;
position:relative;
overflow:hidden;
}

.hero::before{
content:'';
position:absolute;
width:300px;
height:300px;
background:rgba(255,255,255,.05);
border-radius:50%;
right:-80px;
top:-100px;
}

.hero::after{
content:'';
position:absolute;
width:220px;
height:220px;
background:rgba(255,255,255,.05);
border-radius:50%;
left:-80px;
bottom:-80px;
}

.topbar{
max-width:1300px;
margin:auto;
display:flex;
align-items:center;
gap:16px;
position:relative;
z-index:2;
}

.logoWrap{
width:72px;
height:72px;
background:white;
border-radius:22px;
display:flex;
align-items:center;
justify-content:center;
padding:8px;
box-shadow:var(--shadow);
}

.logoWrap img{
width:100%;
height:100%;
object-fit:contain;
}

.brand h1{
font-size:28px;
font-weight:800;
color:white;
letter-spacing:.5px;
}

.brand p{
color:rgba(255,255,255,.8);
margin-top:6px;
font-size:14px;
}

.main{
max-width:1300px;
margin:auto;
padding:0 18px 40px;
margin-top:-55px;
position:relative;
z-index:3;
}

.filterPanel{
background:rgba(255,255,255,.92);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.6);
padding:22px;
border-radius:28px;
box-shadow:0 15px 40px rgba(15,23,42,.12);
}

.panelHead{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
gap:10px;
}

.panelHead h2{
font-size:22px;
font-weight:800;
color:var(--primary2);
}

.resultBadge{
background:#e7f3ff;
padding:10px 14px;
border-radius:999px;
font-size:13px;
font-weight:700;
color:var(--primary);
}

.filters{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:16px;
}

.field{
display:flex;
flex-direction:column;
gap:8px;
}

.field label{
font-size:13px;
font-weight:700;
color:#334155;
}

.field select,
.field input{
height:52px;
border-radius:16px;
border:1px solid var(--border);
padding:0 16px;
font-size:14px;
background:white;
outline:none;
transition:.25s;
}

.field select:focus,
.field input:focus{
border-color:#3b82f6;
box-shadow:0 0 0 4px rgba(59,130,246,.12);
}

.grid{
margin-top:26px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
gap:18px;
}

.card{
background:var(--card);
border-radius:24px;
padding:22px;
position:relative;
overflow:hidden;
box-shadow:var(--shadow);
transition:.3s ease;
border:1px solid #edf2f7;
}

.card:hover{
transform:translateY(-4px);
}

.card::before{
content:'';
position:absolute;
top:0;
left:0;
width:100%;
height:6px;
background:linear-gradient(90deg,#0d4d8b,#1da1f2);
}

.hospitalTop{
display:flex;
justify-content:space-between;
gap:12px;
margin-bottom:16px;
}

.hospitalName{
font-size:18px;
font-weight:800;
line-height:1.4;
color:#0f172a;
}

.code{
background:#eff6ff;
color:#0d4d8b;
padding:8px 12px;
border-radius:12px;
font-size:12px;
font-weight:700;
height:fit-content;
white-space:nowrap;
}

.info{
margin-top:10px;
display:grid;
gap:10px;
}

.infoItem{
display:flex;
gap:10px;
font-size:14px;
line-height:1.6;
}

.infoItem strong{
min-width:75px;
color:#0d4d8b;
}

.bottomRow{
margin-top:18px;
display:flex;
justify-content:space-between;
flex-wrap:wrap;
gap:10px;
}

.pill{
padding:10px 14px;
border-radius:999px;
font-size:12px;
font-weight:700;
}

.ppnYes{
background:#e9fff0;
color:#0b7a39;
}

.ppnNo{
background:#fff1f1;
color:#c62828;
}

.category{
background:#eef4ff;
color:#0d4d8b;
}

.empty{
background:white;
padding:50px 20px;
text-align:center;
border-radius:24px;
box-shadow:var(--shadow);
}

.empty h3{
font-size:22px;
margin-bottom:10px;
}

.footer{
margin-top:35px;
text-align:center;
font-size:13px;
color:#64748b;
padding-bottom:20px;
}

@media(max-width:1100px){
.filters{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:700px){
.brand h1{
font-size:20px;
}

.main{
padding:0 14px 30px;
}

.filterPanel{
padding:18px;
border-radius:24px;
}

.filters{
grid-template-columns:1fr;
}

.panelHead{
flex-direction:column;
align-items:flex-start;
}

.grid{
grid-template-columns:1fr;
}

.card{
padding:18px;
}

.hospitalName{
font-size:16px;
}

.code{
font-size:11px;
}
}
</style>
</head>
<body>

<section class="hero">
<div class="topbar">
<div class="logoWrap">
<img src="sss logo.png" alt="StaffEx Logo">
</div>

<div class="brand">
<h1>STAFFEX STAFFING SOLUTIONS</h1>
<p>Corporate Hospital Network Portal</p>
</div>
</div>
</section>

<section class="main">

<div class="filterPanel">

<div class="panelHead">
<h2>Find Network Hospitals</h2>
<div class="resultBadge" id="resultCount">0 Hospitals Found</div>
</div>

<div class="filters">

<div class="field">
<label>State</label>
<select id="stateFilter">
<option value="">All States</option>
</select>
</div>

<div class="field">
<label>City</label>
<select id="cityFilter">
<option value="">All Cities</option>
</select>
</div>

<div class="field">
<label>Category</label>
<select id="categoryFilter">
<option value="">All Categories</option>
</select>
</div>

<div class="field">
<label>PPN Network</label>
<select id="ppnFilter">
<option value="">All</option>
<option value="YES">PPN YES</option>
<option value="NO">PPN NO</option>
</select>
</div>

<div class="field">
<label>Search Hospital</label>
<input type="text" id="searchInput" placeholder="Search hospital name...">
</div>

</div>

</div>

<div class="grid" id="hospitalGrid"></div>

<div class="footer">
Powered by StaffEx Staffing Solutions • Mobile Optimized Hospital Discovery Platform
</div>

</section>

<script>

// Paste your full hospitals.json data below
// Example:
// const HOSPITAL_DATA = [...];

const HOSPITAL_DATA = [];

const hospitals = HOSPITAL_DATA;

const stateFilter = document.getElementById('stateFilter');
const cityFilter = document.getElementById('cityFilter');
const categoryFilter = document.getElementById('categoryFilter');
const ppnFilter = document.getElementById('ppnFilter');
const searchInput = document.getElementById('searchInput');
const hospitalGrid = document.getElementById('hospitalGrid');
const resultCount = document.getElementById('resultCount');

function uniqueValues(key){
return [...new Set(hospitals.map(item => item[key]).filter(Boolean))].sort();
}

function populateDropdown(select, values){
values.forEach(value=>{
const option=document.createElement('option');
option.value=value;
option.textContent=value;
select.appendChild(option);
});
}

populateDropdown(stateFilter, uniqueValues('State'));
populateDropdown(cityFilter, uniqueValues('City'));
populateDropdown(categoryFilter, uniqueValues('Category'));

function renderHospitals(){

const state = stateFilter.value;
const city = cityFilter.value;
const category = categoryFilter.value;
const ppn = ppnFilter.value;
const search = searchInput.value.toLowerCase();

const filtered = hospitals.filter(h=>{

const matchState = !state || h.State === state;
const matchCity = !city || h.City === city;
const matchCategory = !category || h.Category === category;
const matchPPN = !ppn || h.PPN === ppn;
const matchSearch = h.HospitalName.toLowerCase().includes(search);

return matchState && matchCity && matchCategory && matchPPN && matchSearch;
});

resultCount.innerText = `${filtered.length} Hospitals Found`;

if(filtered.length===0){
hospitalGrid.innerHTML=`
<div class="empty">
<h3>No Hospitals Found</h3>
<p>Please try changing filters or search keyword.</p>
</div>
`;
return;
}

hospitalGrid.innerHTML = filtered.map(h => `

<div class="card">

<div class="hospitalTop">
<div class="hospitalName">${h.HospitalName}</div>
<div class="code">${h.HospitalCode}</div>
</div>

<div class="info">
<div class="infoItem"><strong>Address</strong><span>${h.Address}</span></div>
<div class="infoItem"><strong>City</strong><span>${h.City}</span></div>
<div class="infoItem"><strong>State</strong><span>${h.State}</span></div>
<div class="infoItem"><strong>Pincode</strong><span>${h.Pincode}</span></div>
<div class="infoItem"><strong>Region</strong><span>${h.Region}</span></div>
</div>

<div class="bottomRow">
<div class="pill category">${h.Category}</div>
<div class="pill ${h.PPN==='YES' ? 'ppnYes':'ppnNo'}">PPN ${h.PPN}</div>
</div>

</div>
`).join('');
}

stateFilter.addEventListener('change', renderHospitals);
cityFilter.addEventListener('change', renderHospitals);
categoryFilter.addEventListener('change', renderHospitals);
ppnFilter.addEventListener('change', renderHospitals);
searchInput.addEventListener('input', renderHospitals);

renderHospitals();

</script>
</body>
</html>
